name: Phase 240 plan-contract repair

on:
  pull_request:
    paths:
      - ".github/workflows/phase240-audit-probe.yml"

permissions:
  contents: write

jobs:
  repair-plan-contract:
    if: github.event.pull_request.number == 380
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase/240-execution-context-governance
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Create truthful Phase 240 plan contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from qor.scripts import ai_provenance, gate_chain, session, shadow_process

          sid = session.rotate()
          capability = "execution-context-governance"
          spec_dir = Path("qor/specs") / capability
          delta_dir = spec_dir / "deltas"
          delta_dir.mkdir(parents=True, exist_ok=True)
          spec_path = spec_dir / "spec.md"
          if not spec_path.exists():
              spec_path.write_text("# Capability: Execution Context Governance\n", encoding="utf-8")

          delta_path = delta_dir / f"{sid}.md"
          delta_path.write_text("""# Phase 240 Execution-Context Governance Delta

## ADDED Requirements

### Requirement: Model identity is provenance only
Governance admission MUST treat declared or responder model identity as provenance rather than execution authority.

#### Scenario: Unknown model family
- GIVEN a governed skill invocation with an unknown or non-vendor-specific model family
- WHEN execution-context admission is evaluated
- THEN model identity alone does not deny entry

### Requirement: Hard capability absence requires complete inventory
A hard execution capability MUST be classified as missing only when the runtime declares its capability inventory complete and the requirement is absent.

#### Scenario: Incomplete telemetry
- GIVEN a runtime whose capability inventory is not declared complete
- WHEN a required capability is not observed
- THEN the requirement is reported as unverified rather than missing

### Requirement: Rendering adaptation is bounded
Runtime rendering adaptation MUST select only a recipe explicitly admitted by the governed skill contract.

#### Scenario: Unadmitted rendering hint
- GIVEN a rendering hint outside the skill's admitted recipe set
- WHEN the execution context selects a rendering recipe
- THEN selection falls back deterministically without changing governance semantics

### Requirement: Active skills do not pin named models
Executable skill admission metadata MUST remain free of named-model allowlists and vendor capability tiers.

#### Scenario: Corpus regression
- GIVEN the active qor/skills corpus
- WHEN admission metadata is inspected
- THEN retired model_compatibility and min_model_capability fields are absent

### Requirement: Audit entry is vendor-neutral
The audit runtime MUST block entry only when a declared hard execution requirement is proven missing under complete capability telemetry.

#### Scenario: Non-vendor-specific audit host
- GIVEN a non-vendor-specific model identity with no proven missing hard requirement
- WHEN qor-audit checks execution context
- THEN the audit protocol remains reachable

### Requirement: Fabrication protection is independent
The NR-001 and NR-002 fabrication-risk protections MUST remain binding independently of model identity or rendering recipe.

#### Scenario: Compatibility transition
- GIVEN the retired model-pinning authority mechanism has been removed
- WHEN compatibility linting or compiled variants are evaluated
- THEN fabrication-risk protections remain active
""", encoding="utf-8")

          # The original plan existed before this recovery session but its gate artifact did not.
          # Record that fact as an explicit operator-authorized advisory override instead of
          # fabricating a predecessor research artifact.
          gate_chain.emit_gate_override(
              current_phase="plan",
              prior_phase_name="research",
              reason=(
                  "operator-authorized Phase 240 governance recovery: the approved plan and "
                  "implementation predate this session, but no canonical research gate artifact "
                  "exists for the recovered plan contract"
              ),
              session_id=sid,
              override_authority="user",
          )

          payload = {
              "ts": shadow_process.now_iso(),
              "plan_path": "docs/plan-qor-phase240-execution-context-governance.md",
              "phases": [
                  "Phase 1 — Execution-context seam",
                  "Phase 2 — Live skill migration",
                  "Phase 3 — Wire real consumers",
                  "Phase 4 — Compatibility and safety",
                  "Phase 5 — Tests",
              ],
              "ci_commands": [
                  "python -m pytest tests/test_execution_context.py tests/test_model_pinning_frontmatter.py tests/test_qor_audit_execution_context.py -q",
                  "python -m pytest tests/ -q",
                  "python qor/scripts/check_variant_drift.py",
                  "python -m ruff check qor tests",
              ],
              "open_questions": [],
              "doc_tier": "system",
              "change_class": "governance",
              "originating_remediation": "GH #379",
              "feature_inventory_touches": [],
              "required_gate_artifacts": ["plan", "audit", "implement", "substantiate"],
              "spec_deltas": [{
                  "capability": capability,
                  "delta_path": delta_path.as_posix(),
                  "ops": ["ADDED"],
                  "evidence": "qor/scripts/execution_context.py",
              }],
          }
          manifest = ai_provenance.build_manifest(
              "plan",
              host="chatgpt",
              model_family="gpt-5.6-sol",
              human_oversight=ai_provenance.HumanOversight.ABSENT,
          )
          out = gate_chain.write_gate_artifact(
              phase="plan", payload=payload, session_id=sid,
              ai_provenance=manifest, skill="plan",
          )
          Path(".phase240-session").write_text(sid + "\n", encoding="utf-8")
          print(f"PHASE240_SESSION={sid}")
          print(f"PLAN_ARTIFACT={out}")
          PY
      - name: Validate repaired plan contract
        shell: bash
        run: |
          SID="$(cat .phase240-session)"
          DELTA="qor/specs/execution-context-governance/deltas/${SID}.md"
          python -m qor.scripts.spec_lint --files qor/specs/execution-context-governance/spec.md
          python -m qor.scripts.spec_lint --delta --files "$DELTA"
          python -m qor.scripts.validate_gate_artifact plan ".qor/gates/${SID}/plan.json"
          qor-logic scripts plan_iteration_status_lint --plan docs/plan-qor-phase240-execution-context-governance.md
          python qor/scripts/check_variant_drift.py
      - name: Assert recovery boundary and commit
        shell: bash
        run: |
          SID="$(cat .phase240-session)"
          rm .phase240-session
          python - <<'PY'
          import subprocess
          changed = [line[3:] for line in subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines() if line.strip()]
          allowed_exact = {"docs/PROCESS_SHADOW_GENOME_UPSTREAM.md"}
          allowed_prefixes = (".qor/gates/", "qor/specs/execution-context-governance/")
          bad = [p for p in changed if p not in allowed_exact and not p.startswith(allowed_prefixes)]
          if bad:
              raise SystemExit(f"plan recovery escaped governed boundary: {bad}")
          if not any(p.startswith(".qor/gates/") and p.endswith("/plan.json") for p in changed):
              raise SystemExit("missing plan gate artifact")
          if not any("/deltas/" in p for p in changed):
              raise SystemExit("missing behavioral spec delta")
          print("plan recovery boundary validated")
          PY
          git config user.name "qor-governance-bot"
          git config user.email "qor-governance-bot@users.noreply.github.com"
          git add ".qor/gates/${SID}" qor/specs/execution-context-governance/ docs/PROCESS_SHADOW_GENOME_UPSTREAM.md
          git commit -m "governance(phase240): declare execution-context spec delta"
          git push origin HEAD:phase/240-execution-context-governance
