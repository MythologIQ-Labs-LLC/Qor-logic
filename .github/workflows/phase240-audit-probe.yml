name: Phase 240 variant regeneration

on:
  pull_request:
    paths:
      - ".github/workflows/phase240-audit-probe.yml"

permissions:
  contents: write

jobs:
  regenerate-variants:
    if: github.event.pull_request.number == 380
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase/240-execution-context-governance
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Regenerate compiled variants
        shell: bash
        env:
          BUILD_REGEN: "1"
        run: python qor/scripts/dist_compile.py
      - name: Assert regeneration boundary
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          changed = [line[3:] for line in subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines() if line.strip()]
          allowed_manifests = {"qor/dist/manifest.json"} | {
              f"qor/dist/variants/{host}/manifest.json"
              for host in ("claude", "cline", "codex", "cursor", "gemini", "kilo-code")
          }
          manifests = [p for p in changed if p in allowed_manifests]
          payloads = [p for p in changed if p.startswith("qor/dist/variants/") and p not in allowed_manifests]
          bad = [p for p in changed if p not in allowed_manifests and not p.startswith("qor/dist/variants/")]
          if bad:
              raise SystemExit(f"regeneration escaped qor/dist/: {bad}")
          if set(manifests) != allowed_manifests:
              raise SystemExit(f"manifest set mismatch: {manifests}")
          if len(payloads) != 47:
              raise SystemExit(f"expected 47 stale variant payloads, got {len(payloads)}")
          if len(changed) != 54:
              raise SystemExit(f"expected 54 generated changes total, got {len(changed)}")
          print("validated 47 variant payloads + 7 manifests; no boundary escape")
          PY
          python qor/scripts/check_variant_drift.py
      - name: Commit regenerated variants
        shell: bash
        run: |
          git config user.name "qor-governance-bot"
          git config user.email "qor-governance-bot@users.noreply.github.com"
          git add qor/dist/manifest.json qor/dist/variants/
          git diff --cached --quiet && { echo "nothing staged"; exit 1; }
          git commit -m "build(phase240): regenerate portable skill variants"
          git push origin HEAD:phase/240-execution-context-governance
