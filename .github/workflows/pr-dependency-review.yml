name: PR Dependency Review

# Phase 102 (GH #118 P1): catches vulnerable or banned-severity dependencies
# entering via PRs that touch dependency-bearing files. Fails on `high` severity.

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements-release.in"
      - "requirements-release.txt"
      - "requirements-sbom.in"
      - "requirements-sbom.txt"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # Phase 298 (GH #511): one hard-fail admission step per governed root lockfile.
      - name: Dependency admission cooling-period check - requirements-release.txt (Phase 107; hard-fail)
        run: |
          python -m qor.scripts.dependency_admission_lint \
            --base "${{ github.event.pull_request.base.sha }}" \
            --lockfile requirements-release.txt
      - name: Dependency admission cooling-period check - requirements-sbom.txt (Phase 298; hard-fail)
        run: |
          python -m qor.scripts.dependency_admission_lint \
            --base "${{ github.event.pull_request.base.sha }}" \
            --lockfile requirements-sbom.txt
