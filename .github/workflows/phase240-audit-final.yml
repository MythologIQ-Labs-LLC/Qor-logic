name: Phase 240 final governed audit

on:
  pull_request:
    paths:
      - ".github/workflows/phase240-audit-final.yml"
      - ".github/phase240_audit.py"

permissions:
  contents: write

concurrency:
  group: phase240-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tribunal:
    if: github.event.pull_request.number == 380
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase/240-execution-context-governance
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run bound Phase 240 tribunal against product tree only
        shell: bash
        run: |
          cp .github/phase240_audit.py /tmp/phase240_audit.py
          rm .github/phase240_audit.py .github/workflows/phase240-audit-final.yml
          PYTHON_BIN="$(command -v python)"
          "$PYTHON_BIN" /tmp/phase240_audit.py
      - name: Validate audit gate
        shell: bash
        run: |
          PYTHON_BIN="$(command -v python)"
          "$PYTHON_BIN" -c 'from pathlib import Path; from qor.scripts import validate_gate_artifact as v; p=Path(".qor/gates/2026-08-28T1956-6e0074/audit.json"); e=v.validate_one("audit", p); print("audit gate validation:", e or "OK"); raise SystemExit(1 if e else 0)'
      - name: Commit bounded audit evidence and retire harness
        shell: bash
        env:
          SID: 2026-08-28T1956-6e0074
        run: |
          rm -f .qor/session/current docs/PROCESS_SHADOW_GENOME_UPSTREAM.md.lock
          BAD=0
          while IFS= read -r line; do
            p="${line:3}"
            case "$p" in
              .github/phase240_audit.py|.github/workflows/phase240-audit-final.yml|.agent/staging/AUDIT_REPORT.md|docs/META_LEDGER.md|docs/PROCESS_SHADOW_GENOME_UPSTREAM.md|.qor/gates/$SID/audit*) ;;
              *) echo "unexpected audit evidence change: $p"; BAD=1 ;;
            esac
          done < <(git status --porcelain)
          test "$BAD" -eq 0
          git config user.name "qor-governance-bot"
          git config user.email "qor-governance-bot@users.noreply.github.com"
          git add -A .github/phase240_audit.py .github/workflows/phase240-audit-final.yml .agent/staging/AUDIT_REPORT.md docs/META_LEDGER.md docs/PROCESS_SHADOW_GENOME_UPSTREAM.md ".qor/gates/$SID"
          git commit -m "governance(phase240): record PASS tribunal"
          git push origin HEAD:phase/240-execution-context-governance
