name: Phase 240 complete context migration

on:
  push:
    branches:
      - phase/240-execution-context-governance
    paths:
      - .github/workflows/phase240-complete-context-migration.yml

permissions:
  contents: write

jobs:
  complete-context-migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/240-execution-context-governance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add explicit audit execution-context contract and retire stale test expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path('qor/skills/governance/qor-audit/SKILL.md')
          text = audit.read_text(encoding='utf-8')
          anchor = 'permitted_subagents: []\n'
          contract = (
              'advisory_quality_requirements: [high-reasoning, high-instruction-fidelity]\n'
              'rendering_recipes: [conservative, outcome-first, explicit-checklist]\n'
              'default_rendering_recipe: conservative\n'
          )
          if contract not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('qor-audit frontmatter anchor not unique')
              text = text.replace(anchor, anchor + contract, 1)
              audit.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_qor_plan_skill_invokes_model_pinning_lint.py')
          test = test_path.read_text(encoding='utf-8')
          old_doc = '''"""Phase 55: co-occurrence behavior invariant for model-pinning lint coverage.\n\nConditional rule: enumerate every SKILL.md whose frontmatter declares the\npinning pair (`model_compatibility` + `min_model_capability`). For each such\nskill, assert at least one SKILL.md whose `phase:` is `plan` invokes\n`python -m qor.scripts.model_pinning_lint`.\n\nAnchored to actual frontmatter-declaration set, not a single-skill substring.\n"""'''
          new_doc = '''"""Phase 240: retired model pins stay absent while the compatibility lint remains wired.\n\nThe active skill corpus must contain no `model_compatibility` or\n`min_model_capability` admission metadata. The historical command name\n`model_pinning_lint` remains temporarily wired from a plan-phase skill because\nit now surfaces execution-context inspection and fabrication-risk checks.\n"""'''
          if old_doc not in test:
              raise SystemExit('expected legacy test module docstring not found')
          test = test.replace(old_doc, new_doc, 1)

          old_fn = '''def test_skills_with_pinning_keys_are_covered_by_pinning_lint_invocation():\n    pinning_skills = _skills_with_pinning_keys()\n    assert pinning_skills, "expected >=1 skill declaring model-pinning frontmatter"\n\n    plan_skills = _plan_phase_skills()\n    assert plan_skills, "expected >=1 skill with phase: plan"\n\n    invokers = [\n        s for s in plan_skills\n        if any(\n            form in s.read_text(encoding="utf-8")\n            for form in (\n                "python -m qor.scripts.model_pinning_lint",\n                "qor-logic scripts model_pinning_lint",\n            )\n        )\n    ]\n    assert invokers, (\n        f"At least one phase: plan skill MUST invoke model_pinning_lint to cover "\n        f"the {len(pinning_skills)} skills declaring pinning frontmatter; "\n        f"none of {len(plan_skills)} plan-phase skills do."\n    )\n'''
          new_fn = '''def test_active_skills_have_no_retired_pins_and_plan_keeps_compatibility_lint():\n    pinning_skills = _skills_with_pinning_keys()\n    assert not pinning_skills, (\n        "retired model admission metadata remains in active skills: "\n        f"{[str(path.relative_to(REPO_ROOT)) for path in pinning_skills]}"\n    )\n\n    plan_skills = _plan_phase_skills()\n    assert plan_skills, "expected >=1 skill with phase: plan"\n\n    invokers = [\n        s for s in plan_skills\n        if any(\n            form in s.read_text(encoding="utf-8")\n            for form in (\n                "python -m qor.scripts.model_pinning_lint",\n                "qor-logic scripts model_pinning_lint",\n            )\n        )\n    ]\n    assert invokers, (\n        "At least one phase: plan skill MUST retain the compatibility lint "\n        "while it owns execution-context inspection and fabrication-risk checks."\n    )\n'''
          if old_fn not in test:
              raise SystemExit('expected legacy test function not found')
          test = test.replace(old_fn, new_fn, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Verify exact changed-file boundary
        shell: bash
        run: |
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          qor/skills/governance/qor-audit/SKILL.md
          tests/test_qor_plan_skill_invokes_model_pinning_lint.py
          EOF
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Verify migration invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          retired=[]
          named=[]
          for path in Path('qor/skills').rglob('SKILL.md'):
              text=path.read_text(encoding='utf-8')
              if 'model_compatibility:' in text or 'min_model_capability:' in text:
                  retired.append(str(path))
              for token in ('claude-opus-', 'claude-sonnet-', 'claude-haiku-'):
                  if token in text:
                      named.append(f'{path}:{token}')
          if retired or named:
              raise SystemExit(f'retired={retired}; named={named}')
          PY

      - name: Run migration regression tests
        shell: bash
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest \
            tests/test_execution_context.py \
            tests/test_qor_audit_execution_context.py \
            tests/test_qor_audit_runtime.py \
            tests/test_qor_plan_skill_invokes_model_pinning_lint.py \
            tests/test_e2e.py -q

      - name: Commit migration completion
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qor/skills/governance/qor-audit/SKILL.md tests/test_qor_plan_skill_invokes_model_pinning_lint.py
          git commit -m 'fix: complete vendor-neutral audit context migration'
          git push origin HEAD:phase/240-execution-context-governance
